# 公开仓的发布 workflow —— 由 scripts/sync-public-sdk.sh 同步到
# .github/workflows/publish.yml。**源文件在 monorepo，改这里，不要改公开仓那份**
# （下一次同步会覆盖它）。
#
# 用 PyPI API token 发版。凭据放在仓库 secret `PYPI_API_TOKEN` 里。
#
# 原本这里走的是 Trusted Publishing（OIDC，无长期凭据），但它在本仓从未成功过
# 一次：4.0.0 连推两次 tag，测试 / build / twine check 全绿，每次都只挂在最后
# 的上传步。Trusted Publishing 要求 PyPI 表单里的五项与签发令牌的仓库逐字吻合，
# 而它的报错（"not a valid publisher"）**不告诉你是哪一项对不上** —— 最容易栽的
# 是把 Repository name 填成 PyPI 包名：包名是 sagax-amadeus，GitHub 仓库名却是
# sagax_amadeus_python，两者不同名，而表单同时要这两个。
#
# token 的代价是多了一个长期凭据要管，换来的是失败时能看懂：token 错就是 403
# Invalid or non-existent authentication information，指向明确。
#
# 想换回 Trusted Publishing 的话，删掉下面的 password 那行即可（有 id-token
# 权限时该 action 自动走 OIDC），但先把 PyPI 表单这五项核对清楚：
#
#     PyPI Project Name   sagax-amadeus              ← 包名
#     Owner               mortysean
#     Repository name     sagax_amadeus_python       ← 仓库名，不是包名
#     Workflow name       publish.yml
#     Environment name    pypi
name: publish

on:
  push:
    tags: ["v*"]        # 只有打 tag 才发版。每次 push 都发的话，一个手滑的
                        # commit 就会占掉一个再也拿不回来的版本号。

permissions:
  contents: read

jobs:
  # 测试和发布分成两个 job：发布 job 拿着 id-token 权限，能以仓库身份向 PyPI
  # 认证。测试 job 不需要那个权限，也就不该有 —— 跑测试的地方权限越小越好。
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject 里声明支持 3.10+，那就每一档都真跑一遍。声明支持却没测过
        # 的版本，等于让用户替我们发现问题。
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 装包与测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: 跑测试
        # 依赖闭源引擎的那 20 个用例在这里会自动跳过（HAS_CLOUD=False）。
        run: python -m pytest tests/ -q

      - name: 确认零运行时依赖
        # 薄客户端只用标准库。哪天有人顺手加了个 requests，这里会红。
        run: |
          python - <<'PY'
          import importlib.metadata as md
          hard = [r for r in (md.requires("sagax-amadeus") or [])
                  if "extra ==" not in r]
          assert not hard, f"SDK 不该有运行时依赖: {hard}"
          print("✓ 零依赖")
          PY

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: tag 必须与 pyproject 的版本号一致
        # 打错 tag 会发出一个版本号和内容对不上的包，而 PyPI 不允许重传同一个
        # 版本号 —— 发现的时候已经晚了。
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "$PKG" ] || {
            echo "::error::tag v$TAG 与 pyproject 版本 $PKG 不一致"; exit 1; }
          echo "✓ v$TAG"

      - name: twine check
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # 上传已经改用 token，这里留着 id-token 只为**签名证明**（PEP 740
      # attestations）—— 该 action 默认要生成它，缺这个权限会直接失败。
      # 它不再参与认证。
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: secret 必须存在
        # 没配 secret 时，${{ secrets.* }} 展开成空串，该 action 会拿空密码去传，
        # 报一个和「token 写错了」一模一样的 403 —— 于是你会去翻 token 对不对，
        # 而真正的问题是它压根没配。这一步把这两种情况分开。
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || {
            echo "::error::仓库 secret PYPI_API_TOKEN 没配（或在 pypi 环境下不可见）"
            exit 1; }
          case "$TOKEN" in
            pypi-*) echo "✓ secret 已配置（pypi- 开头，长度 ${#TOKEN}）" ;;
            *) echo "::error::PYPI_API_TOKEN 不以 pypi- 开头，八成贴错了东西"
               exit 1 ;;
          esac

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 传了 password 就走 token 认证，不再尝试 OIDC。
          password: ${{ secrets.PYPI_API_TOKEN }}
